name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - name: Which YouTube clients work from a runner
        run: |
          python - <<'PY'
          import subprocess, sys
          vid = "https://www.youtube.com/watch?v=jNQXAC9IVRw"
          clients = ["default", "android_vr", "tv", "web_safari", "ios", "mweb", "web_embedded", "android"]
          def try_client(client, audio_only):
              args = [sys.executable, "-m", "yt_dlp", "--no-playlist", "--quiet", "--no-warnings",
                      "-o", "probe.%(ext)s", "--no-part", "--retries", "1", "--socket-timeout", "20"]
              if audio_only:
                  args += ["-f", "ba[ext=m4a]/ba/worst"]
              else:
                  args += ["-f", "worst[ext=mp4]/worst", "--max-filesize", "5M"]
              if client != "default":
                  args += ["--extractor-args", "youtube:player_client=" + client]
              args.append(vid)
              r = subprocess.run(args, capture_output=True, text=True, timeout=180)
              out = (r.stdout + r.stderr).strip().splitlines()
              tail = out[-1][:150] if out else ""
              return r.returncode == 0, tail
          ok_any = False
          for audio in (False, True):
              kind = "audio" if audio else "video"
              print("=== " + kind + " ===")
              for c in clients:
                  try:
                      ok, tail = try_client(c, audio)
                  except Exception as e:
                      ok, tail = False, str(e)[:120]
                  print(("OK      " if ok else "BLOCKED ") + (kind + " via " + c) + "  |  " + tail)
                  ok_any = ok_any or ok
          print("ANY_WORKED:", ok_any)
          PY
