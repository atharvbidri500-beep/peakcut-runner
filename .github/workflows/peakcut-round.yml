# PeakCut round. GitHub's own scheduler proved unreliable, so each run ARRANGES THE NEXT ONE
# itself: a chain with no gaps, forever. While the PC is alive the round steps aside in about a
# minute; the moment the PC's heartbeat stops, the chain becomes the engine: it restores the clips
# this PC had queued and posts them on the schedule (one winner an hour, best clip first).
name: peakcut-round

on:
  schedule:
    - cron: "7 */2 * * *"      # backup only: the chain keeps the real cadence
  workflow_dispatch:

concurrency:
  group: peakcut
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Kolkata
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEAKCUT_SNAPSHOT: ${{ secrets.PEAKCUT_SNAPSHOT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PEAKCUT_DATA: ${{ github.workspace }}/data
      PEAKCUT_MODELS: ${{ github.workspace }}/models
      PEAKCUT_HOST: 127.0.0.1
      PEAKCUT_PORT: 8765
      PEAKCUT_NO_DOWNLOAD: "1"
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Pull code, state and the posting queue
        run: |
          pip install -q huggingface_hub
          python ci/fetch.py

      - name: Run the round (40 minutes)
        if: env.SKIP_ROUND != '1'
        run: |
          python -m pip install -q -r requirements.txt || python -m pip install -q fastapi uvicorn httpx pillow numpy soundfile
          python -m studio.server &
          echo $! > server.pid
          sleep 2400
          kill -TERM $(cat server.pid) 2>/dev/null || true
          sleep 8

      - name: Save state back
        if: always() && env.SKIP_ROUND != '1'
        run: |
          pip install -q huggingface_hub
          python ci/final_backup.py

      - name: Arrange the next round
        if: always()
        run: |
          if [ "$SKIP_ROUND" = "1" ]; then
            sleep 1800            # the PC is alive: look again in half an hour
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/peakcut-round.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "next round arranged"
