# PeakCut round. GitHub's own scheduler proved unreliable, so each run ARRANGES THE NEXT ONE
# itself: a chain with no gaps, forever. While the PC is alive the round steps aside in about a
# minute; the moment the PC's heartbeat stops, the chain runs full rounds on its own.
name: peakcut-round

on:
  schedule:
    - cron: "7 */2 * * *"      # backup only: the chain keeps the real cadence
  workflow_dispatch:

concurrency:
  group: peakcut
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Kolkata
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEAKCUT_SNAPSHOT: ${{ secrets.PEAKCUT_SNAPSHOT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PEAKCUT_DATA: ${{ github.workspace }}/data
      PEAKCUT_MODELS: ${{ github.workspace }}/models
      PEAKCUT_HOST: 127.0.0.1
      PEAKCUT_PORT: 8765
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Pull code and state
        run: |
          pip install -q huggingface_hub
          python ci/fetch.py

      - name: Speech model (cached)
        if: env.SKIP_ROUND != '1'
        uses: actions/cache@v4
        with:
          path: models
          key: peakcut-asr

      - name: Fetch model if missing
        if: env.SKIP_ROUND != '1'
        run: python -m studio.fetch_model

      - name: YouTube probe
        if: env.SKIP_ROUND != '1'
        run: |
          pip install -q yt-dlp
          if yt-dlp -f "worst[ext=mp4]/worst" --max-filesize 5M -o "probe.%(ext)s" --no-part \
             --no-playlist "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | tail -2; then
            echo "PROBE_OK: YouTube downloads work from this runner"
          else
            echo "PROBE_BLOCKED: YouTube is blocking this runner's IP - video downloads may fail here"
          fi

      - name: Run the round (25 minutes)
        if: env.SKIP_ROUND != '1'
        run: |
          python -m studio.server &
          echo $! > server.pid
          sleep 1500
          kill -TERM $(cat server.pid) 2>/dev/null || true
          sleep 8

      - name: Save state back
        if: always() && env.SKIP_ROUND != '1'
        run: |
          pip install -q huggingface_hub
          python ci/final_backup.py

      - name: Arrange the next round
        if: always()
        run: |
          if [ "$SKIP_ROUND" = "1" ]; then
            sleep 1800            # the PC is alive: look again in half an hour
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/peakcut-round.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "next round arranged"
